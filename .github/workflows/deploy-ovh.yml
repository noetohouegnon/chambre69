# Mise en ligne automatique du site Chambre 69 sur l'hébergement web OVH.
# Se lance à la main : onglet Actions → « Mise en ligne OVH » → Run workflow.
#
# Secrets à créer une fois (dépôt → Settings → Secrets and variables → Actions) :
#   OVH_HOST         ex. ftp.cluster0XX.hosting.ovh.net
#   OVH_USER         identifiant FTP
#   OVH_PASSWORD     mot de passe FTP
# Variables facultatives (onglet « Variables ») :
#   SITE_URL         ex. https://chambre69.sn   (sinon https://chambre69.sn)
#   OVH_PROTOCOL     auto (par défaut : essaie FTPS, puis SFTP, puis FTP), ou ftps / sftp / ftp
#   OVH_FORCE_HTTPS  false tant que le certificat HTTPS n'est pas actif (site de test en http)
#   OVH_DIR          dossier du site sur l'hébergement (par défaut : www)

name: Mise en ligne OVH

on:
  # Mise en ligne volontaire uniquement : Actions → « Mise en ligne OVH » → Run workflow.
  # (Pour la remettre en automatique à chaque modification, voir DEPLOYMENT.md.)
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project_room69
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project_room69/package-lock.json

      - name: Installation
        run: npm ci

      - name: Construction du site
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://chambre69.sn' }}
        run: npm run build

      - name: Réglages OVH (.htaccess)
        env:
          FORCE_HTTPS: ${{ vars.OVH_FORCE_HTTPS || 'true' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://chambre69.sn' }}
        run: |
          cp ovh/.htaccess dist/.htaccess
          # Tant que le certificat HTTPS n'est pas prêt : pas de redirection forcée vers https
          # (sinon le site de test affiche une erreur).
          if [ "$FORCE_HTTPS" = "false" ]; then
            python3 - <<'PY'
          import re
          p = 'dist/.htaccess'
          s = open(p).read()
          s = re.sub(r"  # 1\. Toujours en HTTPS.*?\n\n", "", s, flags=re.S)
          s = s.replace("; upgrade-insecure-requests", "")
          s = re.sub(r'  Header always set Strict-Transport-Security[^\n]*\n', "", s)
          open(p, 'w').write(s)
          PY
            echo "HTTPS forcé désactivé (test en http)."
          fi
          # Site de test (adresse en « test. » ou adresse technique OVH) : invisible pour Google.
          case "$SITE_URL" in
            *//test.*|*hosting.ovh.net*)
              sed -i 's|<IfModule mod_headers.c>|<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"|' dist/.htaccess
              printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
              echo "Site de test : non indexable." ;;
          esac
          # Tant que le certificat HTTPS n'est pas prêt : pas de redirection forcée vers https
          # (sinon le site de test affiche une erreur).
          if [ "$FORCE_HTTPS" = "false" ]; then
            python3 - <<'PY'
          import re
          p = 'dist/.htaccess'
          s = open(p).read()
          s = re.sub(r"  # 1\. Toujours en HTTPS.*?\n\n", "", s, flags=re.S)
          s = s.replace("; upgrade-insecure-requests", "")
          s = re.sub(r'  Header always set Strict-Transport-Security[^\n]*\n', "", s)
          open(p, 'w').write(s)
          PY
            echo "HTTPS forcé désactivé (test en http)."
          fi
          # Site de test (adresse en « test. » ou adresse technique OVH) : invisible pour Google.
          case "$SITE_URL" in
            *//test.*|*hosting.ovh.net*)
              sed -i 's|<IfModule mod_headers.c>|<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"|' dist/.htaccess
              printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
              echo "Site de test : non indexable." ;;
          esac

      - name: Site prêt à envoyer (à télécharger depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: site-chambre69-ovh
          path: project_room69/dist/
          include-hidden-files: true
          retention-days: 30

      - name: Envoi sur OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
          OVH_PROTOCOL: ${{ vars.OVH_PROTOCOL || 'auto' }}
          OVH_DIR: ${{ vars.OVH_DIR || 'www' }}
          OVH_CLEAN: ${{ vars.OVH_CLEAN || 'false' }}
        run: |
          # Par défaut, aucun fichier existant n'est supprimé sur OVH ; OVH_CLEAN=true pour tout remplacer.
          DELETE=''; [ "$OVH_CLEAN" = "true" ] && DELETE='--delete'
          if [ -z "$OVH_HOST" ] || [ -z "$OVH_USER" ] || [ -z "$OVH_PASSWORD" ]; then
            echo "::warning::Accès FTP OVH pas encore renseignés : site construit mais non envoyé. Téléchargez « site-chambre69-ovh » (Artifacts) et déposez-le à la main dans le dossier www."
            exit 0
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          upload() {  # $1 = nom de la méthode, $2 = adresse, $3 = réglages de connexion
            echo "::group::Essai : $1"
            if lftp -u "$OVH_USER","$OVH_PASSWORD" "$2" -e "
                set cmd:fail-exit yes;
                $3
                set net:max-retries 1; set net:timeout 20; set net:reconnect-interval-base 2;
                mkdir -p -f $OVH_DIR;
                mirror --reverse $DELETE --verbose=1 --parallel=4 \
                       --exclude-glob .ovhconfig --exclude-glob .well-known/ \
                       dist/ $OVH_DIR/;
                bye"; then
              echo "::endgroup::"; echo "Site mis en ligne ($1)."; return 0
            fi
            echo "::endgroup::"; echo "Échec avec : $1"; return 1
          }
          ftps()  { upload "FTP chiffré (FTPS)" "ftp://$OVH_HOST"  "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;"; }
          sftp()  { upload "SFTP"               "sftp://$OVH_HOST" "set sftp:auto-confirm yes;"; }
          ftp()   { echo "::warning::Connexion FTP non chiffrée (l'hébergement refuse FTPS et SFTP). Changez le mot de passe FTP une fois la mise en ligne terminée."
                    upload "FTP simple" "ftp://$OVH_HOST" "set ftp:ssl-allow no;"; }
          case "$OVH_PROTOCOL" in
            ftps) ftps ;;
            sftp) sftp ;;
            ftp)  ftp ;;
            *)    ftps || sftp || ftp ;;
          esac
